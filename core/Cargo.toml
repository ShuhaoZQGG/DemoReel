[package]
name = "demoreel-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "demoreel_core"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
approx = "0.5"
